{% load static %}
{# Reusable form field wrapper #}
<div class="lv-form-group{% if group_class %} {{ group_class }}{% endif %}">
  {% if label %}
    <label for="{{ field.id_for_label }}" class="lv-label">{{ label }}</label>
  {% endif %}
  {{ field }}
  {% for error in field.errors %}
    <p class="lv-form-error">{{ error }}</p>
  {% endfor %}
  {% if help_text %}
    <p class="lv-help-text">{{ help_text }}</p>
  {% endif %}
</div>
