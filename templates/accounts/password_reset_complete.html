{% extends "accounts/base_auth.html" %}

{% block auth_content %}
  <div class="text-center">
    <div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-full bg-green-100 text-2xl">✅</div>
    <h1 class="text-xl font-semibold text-gray-900">Password updated</h1>
    <p class="text-sm text-gray-500 mt-2">Your password has been set. You can now sign in.</p>
    <a href="{% url 'accounts:login' %}"
       class="mt-6 inline-flex justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition">
      Sign in
    </a>
  </div>
{% endblock %}
